<div class="flex h-screen overflow-hidden">
  <!-- Sidebar Navigation (left) -->
  <aside class="w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col">
    <div class="p-6 flex items-center gap-3">
      <div class="size-8 bg-primary rounded-lg flex items-center justify-center text-white">
        <span class="material-symbols-outlined">medical_services</span>
      </div>
      <h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">MediAI</h2>
    </div>
    <div class="px-4 mb-4">
      <button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary/90 text-white font-semibold py-3 px-4 rounded-xl transition-colors">
        <span class="material-symbols-outlined text-lg">add</span>
        New Consultation
      </button>
    </div>
    <nav class="flex-1 overflow-y-auto px-2 space-y-1">
      <div class="px-4 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Recent Chats</div>
      <a class="flex items-center gap-3 px-4 py-3 rounded-lg bg-primary/10 text-primary font-medium" href="#"> 
        <span class="material-symbols-outlined">chat_bubble</span>
        <span class="truncate">Morning Headache Analysis</span>
      </a>
    </nav>
    <div class="p-4 border-t border-slate-200 dark:border-slate-800">
      <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">
        <img alt="User profile" class="size-10 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuADDc4j_UtvkGcVPa4qGAmV39ZbwiHndAHaRtfnOTG08JN43XP4gZF7FlnZr224jpdmyPAfLJy2qqaAL1fSEOREZBKIO8l8Uy6hpqpYCN7Z7feRo5Yr8x2js6R-h5Yzmnj_ktHboDbVuCcSqDJI5Pmx__a0SSfFZCnJ3WnX9mooKQSjvZjcWfTVF6aatY0A900hyuBOqSzQ_D8I0w5wsD_aZVS0cswiluR3SjrrF4qq4obXQtZ53Gce2WdR-QqMS4dwvwTc9qdgtA"/>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate">John Doe</p>
          <p class="text-xs text-primary font-medium">Premium Member</p>
        </div>
        <span class="material-symbols-outlined text-slate-400">settings</span>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col relative bg-white dark:bg-slate-950">
    <header class="h-16 flex items-center justify-between px-8 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <div class="size-2 rounded-full bg-emerald-500 animate-pulse"></div>
        <h1 class="text-sm font-semibold text-slate-500">MediAI Advisor is online</h1>
      </div>
    </header>

    <!-- Chat Content -->
    <div #scrollWrap class="flex-1 overflow-y-auto p-6 md:p-10 space-y-8 max-w-4xl mx-auto w-full">
      <div class="flex justify-center">
        <span class="px-3 py-1 bg-slate-100 dark:bg-slate-800 text-slate-500 text-xs font-bold rounded-full uppercase tracking-wider">Today</span>
      </div>

      <ng-container *ngFor="let m of messages">
        <div *ngIf="m.role === 'assistant'" class="flex gap-4 items-start group">
          <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary shrink-0 border border-primary/20">
            <span class="material-symbols-outlined">smart_toy</span>
          </div>
          <div class="flex flex-col gap-2 max-w-[80%]">
            <div class="flex items-baseline gap-2">
              <span class="text-sm font-bold">MediAI Assistant</span>
              <span class="text-[10px] text-slate-400">{{m.time}}</span>
            </div>
            <div class="bg-slate-100 dark:bg-slate-800 p-4 rounded-2xl rounded-tl-none text-slate-800 dark:text-slate-200 leading-relaxed shadow-sm">
              {{m.text}}
            </div>
          </div>
        </div>

        <div *ngIf="m.role === 'user'" class="flex gap-4 items-start justify-end">
          <div class="flex flex-col gap-2 max-w-[80%] items-end">
            <div class="flex items-baseline gap-2">
              <span class="text-[10px] text-slate-400">{{m.time}}</span>
              <span class="text-sm font-bold">You</span>
            </div>
            <div class="bg-primary p-4 rounded-2xl rounded-tr-none text-white leading-relaxed shadow-md">
              {{m.text}}
            </div>
          </div>
          <img alt="User" class="size-10 rounded-xl object-cover shrink-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjEQ6qEokoxTxHTByJKf8wZCJ6pDmHDyPmkZA8Y2zTU_Hj6gSGqmuz6R9IyYfhVyuq2QVlliIjJNQeqjCyb83RTHF55SKq-nxEqsQfBb2llmi5Mje-r6BnfaD7au0k6i6X7k7rxo5fo1SNB-3Pt_2eVILDRXqgAhNiFWiKJZ-qyPGVj9setZ-ukvYB__OtCffpNwsgQzNWY9DWOVv2jf4s56AduMYj9cnKmI3x0IMHiFaMYxZGMfcu9gdSNgaddTsVzmCvmrIQJA"/>
        </div>
      </ng-container>
    </div>

    <!-- Input Area -->
    <footer class="p-6 bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800">
      <div class="max-w-4xl mx-auto flex gap-4 items-center">
        <div class="flex-1 relative">
          <input [(ngModel)]="messageText" (keyup.enter)="sendMessage()" class="w-full bg-slate-100 dark:bg-slate-900 border-none rounded-2xl py-4 px-6 focus:ring-2 focus:ring-primary text-slate-900 dark:text-white placeholder:text-slate-400" placeholder="Type your message or symptoms here..." type="text">
          <div class="absolute right-3 top-1/2 -translate-y-1/2 flex gap-2">
            <button class="p-2 text-slate-400 hover:text-primary transition-colors">
              <span class="material-symbols-outlined">attach_file</span>
            </button>
            <button class="p-2 text-slate-400 hover:text-primary transition-colors">
              <span class="material-symbols-outlined">mic</span>
            </button>
          </div>
        </div>
        <button (click)="sendMessage()" class="bg-primary text-white p-4 rounded-2xl shadow-lg hover:shadow-primary/30 transition-all flex items-center justify-center">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
      <p class="text-center text-[10px] text-slate-400 mt-4 uppercase tracking-widest font-bold">End-to-End Encrypted Health Data</p>
    </footer>
  </main>


</div>
